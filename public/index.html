<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>축구 일정 캘린더</title>
<meta name="description" content="좋아하는 축구팀을 검색해서 경기 일정을 아이폰·구글 캘린더에 구독하세요.">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #16181d; --muted: #6b6f78; --line: #e4e2dc;
    --accent: #0f7a4a; --accent-ink: #ffffff; --soft: #e8f3ed;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --card: #1a1d23; --ink: #eceef2; --muted: #9aa0ab; --line: #2a2e36;
      --accent: #35b77a; --accent-ink: #0b1a12; --soft: #17281f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .search { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; font: inherit; padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); outline: none; }
  input[type=search]:focus { border-color: var(--accent); }
  button, .btn { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.ghost { background: var(--soft); color: var(--ink); }
  .opts { display: flex; gap: 16px; flex-wrap: wrap; margin: 14px 2px 0; color: var(--muted); font-size: 14px; }
  .opts label { display: inline-flex; align-items: center; gap: 6px; }
  select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .status { color: var(--muted); margin: 20px 2px; min-height: 1.5em; }
  .status.err { color: #c2412d; }
  ul.results { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .team { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px;
    background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; font-weight: 500; }
  .team:hover { border-color: var(--accent); }
  .team img { width: 36px; height: 36px; object-fit: contain; flex: none; }
  .team .meta { color: var(--muted); font-size: 13px; font-weight: 400; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-top: 8px; }
  .panel-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .panel-head img { width: 52px; height: 52px; object-fit: contain; }
  .panel-head h2 { margin: 0; font-size: 22px; }
  .url { display: flex; gap: 8px; margin-bottom: 12px; }
  .url input { flex: 1; min-width: 0; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 420px) { .actions { grid-template-columns: 1fr; } }
  .upcoming { margin: 18px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .upcoming li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .upcoming time { color: var(--muted); flex: none; width: 108px; font-variant-numeric: tabular-nums; }
  .back { background: none; color: var(--muted); padding: 0; margin-bottom: 12px; font-weight: 500; }
  footer { color: var(--muted); font-size: 13px; margin-top: 40px; }
  footer a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>⚽ 축구 일정 캘린더</h1>
  <p class="sub">팀을 검색하고 구독하면, 경기 일정이 내 캘린더에 들어오고 시간이 바뀌면 알아서 갱신돼요.</p>

  <form class="search" id="form">
    <input type="search" id="q" placeholder="팀 이름 (예: 토트넘, Athletic Club)" autocomplete="off" required>
    <button type="submit">검색</button>
  </form>
  <div class="opts">
    <label>언어 <select id="lang"><option value="ko">한국어</option><option value="en">English</option></select></label>
    <label>알림 <select id="alarm">
      <option value="0">없음</option><option value="15">15분 전</option><option value="30">30분 전</option>
      <option value="60">1시간 전</option></select></label>
  </div>

  <p class="status" id="status" role="status"></p>
  <ul class="results" id="results"></ul>

  <section class="panel" id="panel" hidden>
    <button class="back" id="back" type="button">← 검색 결과</button>
    <div class="panel-head"><img id="p-logo" alt=""><div><h2 id="p-name"></h2><div class="meta" id="p-meta"></div></div></div>
    <div class="url"><input id="p-url" readonly><button type="button" id="copy" class="btn ghost">복사</button></div>
    <div class="actions">
      <a class="btn" id="p-apple">아이폰·맥 캘린더에 구독</a>
      <a class="btn ghost" id="p-google" target="_blank" rel="noopener">구글 캘린더에 추가</a>
    </div>
    <ul class="upcoming" id="p-up"></ul>
  </section>

  <footer>
    언어나 알림을 바꾸면 구독 주소도 바뀌어요. 이미 구독한 캘린더를 바꾸려면 지우고 다시 구독하세요.
  </footer>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let lastResults = [];
  let current = null;

  try { const p = JSON.parse(localStorage.getItem("fc-opts") || "{}"); if (p.lang) $("lang").value = p.lang; if (p.alarm) $("alarm").value = p.alarm; } catch {}
  function saveOpts() { try { localStorage.setItem("fc-opts", JSON.stringify({ lang: $("lang").value, alarm: $("alarm").value })); } catch {} }

  function setStatus(msg, err = false) { $("status").textContent = msg; $("status").classList.toggle("err", err); }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("q").value.trim();
    if (!q) return;
    $("panel").hidden = true; $("results").hidden = false; $("results").innerHTML = "";
    setStatus("검색 중…");
    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&lang=${$("lang").value}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      lastResults = data.results;
      if (!lastResults.length) return setStatus("검색 결과가 없어요. 영어 이름(예: Tottenham)으로도 검색해 보세요.");
      setStatus(`${lastResults.length}개 팀`);
      $("results").innerHTML = lastResults.map((t, i) => `
        <li><button class="team" type="button" data-i="${i}">
          ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : ""}
          <span>${esc(t.displayName)}${t.displayName !== t.name ? ` <span class="meta">${esc(t.name)}</span>` : ""}
          <br><span class="meta">${esc([t.country, t.venue].filter(Boolean).join(" · "))}</span></span>
        </button></li>`).join("");
    } catch (err) { setStatus("검색에 실패했어요: " + err.message, true); }
  });

  $("results").addEventListener("click", (e) => {
    const b = e.target.closest(".team"); if (!b) return;
    current = lastResults[+b.dataset.i]; showTeam();
  });
  $("back").addEventListener("click", () => { $("panel").hidden = true; $("results").hidden = false; setStatus(`${lastResults.length}개 팀`); });
  for (const id of ["lang", "alarm"]) $(id).addEventListener("change", () => { saveOpts(); if (current && !$("panel").hidden) showTeam(); });

  function calUrl() {
    const p = new URLSearchParams({ lang: $("lang").value });
    if ($("alarm").value !== "0") p.set("alarm", $("alarm").value);
    p.set("name", current.name);
    return `${location.origin}/cal/${encodeURIComponent(current.id)}.ics?${p}`;
  }

  async function showTeam() {
    const url = calUrl();
    const webcal = url.replace(/^https?:/, "webcal:");
    $("results").hidden = true; $("panel").hidden = false; setStatus("");
    $("p-name").textContent = current.displayName; $("p-meta").textContent = current.country || "";
    $("p-logo").src = current.logo || ""; $("p-logo").hidden = !current.logo;
    $("p-url").value = url;
    $("p-apple").href = webcal;
    $("p-google").href = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(webcal);
    $("p-up").innerHTML = `<li><span class="meta">다가오는 경기 불러오는 중…</span></li>`;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error((await res.json()).error || res.status);
      $("p-up").innerHTML = upcoming(await res.text()) || `<li><span class="meta">예정된 경기가 없어요.</span></li>`;
    } catch (err) { $("p-up").innerHTML = `<li class="status err">일정을 불러오지 못했어요: ${esc(err.message)}</li>`; }
  }

  // 미리보기용 간단 ICS 파서
  function upcoming(ics) {
    const text = ics.replace(/\r\n[ \t]/g, "");
    const evs = text.split("BEGIN:VEVENT").slice(1).map((b) => {
      const get = (k) => (b.match(new RegExp(`^${k}[^:]*:(.*)$`, "m")) || [])[1] || "";
      const raw = get("DTSTART"), allDay = /^\d{8}$/.test(raw);
      const d = allDay ? new Date(+raw.slice(0, 4), +raw.slice(4, 6) - 1, +raw.slice(6, 8))
        : new Date(Date.UTC(+raw.slice(0, 4), +raw.slice(4, 6) - 1, +raw.slice(6, 8), +raw.slice(9, 11), +raw.slice(11, 13)));
      return { d, allDay, s: get("SUMMARY").replace(/\\([,;\\])/g, "$1") };
    });
    const now = Date.now() - 3 * 3600e3;
    const ko = $("lang").value === "ko";
    return evs.filter((e) => e.d.getTime() > now).sort((a, b) => a.d - b.d).slice(0, 5).map((e) => {
      const day = e.d.toLocaleDateString(ko ? "ko-KR" : "en-GB", { month: "short", day: "numeric", weekday: "short" });
      const time = e.allDay ? "" : " " + e.d.toLocaleTimeString(ko ? "ko-KR" : "en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
      return `<li><time>${esc(day + time)}</time><span>${esc(e.s)}</span></li>`;
    }).join("");
  }

  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("p-url").value); $("copy").textContent = "복사됨"; }
    catch { $("p-url").select(); document.execCommand("copy"); $("copy").textContent = "복사됨"; }
    setTimeout(() => ($("copy").textContent = "복사"), 1500);
  });
</script>
</body>
</html>
